name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          BIN=spellbook
          ARCHIVE="${BIN}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${ARCHIVE}" "${BIN}"
          shasum -a 256 "dist/${ARCHIVE}" | awk '{print $1}' > "dist/${ARCHIVE}.sha256"
          echo "ARCHIVE_PATH=dist/${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -lh release/

      - name: Print Homebrew formula stanza
        run: |
          set -e
          echo "Copy this into Formula/spellbook.rb in your tap:"
          echo
          ARM_SHA=$(cat release/spellbook-aarch64-apple-darwin.tar.gz.sha256)
          INTEL_SHA=$(cat release/spellbook-x86_64-apple-darwin.tar.gz.sha256)
          LINUX_SHA=$(cat release/spellbook-x86_64-unknown-linux-gnu.tar.gz.sha256)
          VERSION="${GITHUB_REF_NAME#v}"
          cat <<EOF
          version "${VERSION}"
          arm SHA:    ${ARM_SHA}
          intel SHA:  ${INTEL_SHA}
          linux SHA:  ${LINUX_SHA}
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
