name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-compile intel mac from the arm runner to dodge macos-13's
          # frequently long queue. Rust + Apple's universal SDK make this
          # transparent for pure Rust deps.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          BIN=spellbook
          ARCHIVE="${BIN}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${ARCHIVE}" "${BIN}"
          shasum -a 256 "dist/${ARCHIVE}" | awk '{print $1}' > "dist/${ARCHIVE}.sha256"
          echo "ARCHIVE_PATH=dist/${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -lh release/

      - name: Print Homebrew formula stanza
        run: |
          set -e
          echo "Copy this into Formula/spellbook.rb in your tap:"
          echo
          ARM_SHA=$(cat release/spellbook-aarch64-apple-darwin.tar.gz.sha256)
          INTEL_SHA=$(cat release/spellbook-x86_64-apple-darwin.tar.gz.sha256)
          LINUX_SHA=$(cat release/spellbook-x86_64-unknown-linux-gnu.tar.gz.sha256)
          VERSION="${GITHUB_REF_NAME#v}"
          cat <<EOF
          version "${VERSION}"
          arm SHA:    ${ARM_SHA}
          intel SHA:  ${INTEL_SHA}
          linux SHA:  ${LINUX_SHA}
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256

  publish-tap:
    name: Push formula to Homebrew tap
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render formula from template
        id: render
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VER="${TAG#v}"
          ARM=$(cat artifacts/aarch64-apple-darwin/spellbook-aarch64-apple-darwin.tar.gz.sha256)
          INTEL=$(cat artifacts/x86_64-apple-darwin/spellbook-x86_64-apple-darwin.tar.gz.sha256)
          LINUX=$(cat artifacts/x86_64-unknown-linux-gnu/spellbook-x86_64-unknown-linux-gnu.tar.gz.sha256)
          mkdir -p rendered/Formula
          sed \
            -e "s|^  version \"[^\"]*\"|  version \"${VER}\"|" \
            -e "s|REPLACE_WITH_ARM64_MAC_SHA256|${ARM}|" \
            -e "s|REPLACE_WITH_INTEL_MAC_SHA256|${INTEL}|" \
            -e "s|REPLACE_WITH_LINUX_X86_64_SHA256|${LINUX}|" \
            Formula/spellbook.rb > rendered/Formula/spellbook.rb
          # Re-substitute any prior real SHAs in case the template was
          # accidentally committed with patched values (idempotent).
          python3 - <<PYEOF
          import re
          path = "rendered/Formula/spellbook.rb"
          shas = { "aarch64-apple-darwin": "${ARM}",
                   "x86_64-apple-darwin":  "${INTEL}",
                   "x86_64-unknown-linux-gnu": "${LINUX}" }
          src = open(path).read()
          for target, sha in shas.items():
              # find sha256 line within 4 lines after the URL for this target
              pat = re.compile(
                  r'(url\s+"[^"]*' + re.escape(target) + r'[^"]*"\s*\n\s*sha256\s+)"[^"]*"'
              )
              src = pat.sub(lambda m: f'{m.group(1)}"{sha}"', src)
          open(path, "w").write(src)
          PYEOF
          echo "::group::Rendered formula"
          cat rendered/Formula/spellbook.rb
          echo "::endgroup::"

      - name: Check TAP_TOKEN
        id: chk
        env:
          TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TAP_TOKEN secret not set — skipping tap push."
            echo "  Add a Personal Access Token with 'contents: write' on"
            echo "  bkcarlos/homebrew-spellbook as repo secret 'TAP_TOKEN'."
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone, commit, push to tap
        if: steps.chk.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          git clone "https://x-access-token:${TOKEN}@github.com/bkcarlos/homebrew-spellbook.git" tap
          cd tap
          mkdir -p Formula
          cp ../rendered/Formula/spellbook.rb Formula/spellbook.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spellbook.rb
          if git diff --staged --quiet; then
            echo "no changes to formula"
            exit 0
          fi
          BRANCH=$(git branch --show-current)
          [ -z "$BRANCH" ] && BRANCH=master
          git commit -m "Bump spellbook to ${TAG}"
          git push -u origin "$BRANCH"
          echo "  formula pushed: brew tap bkcarlos/spellbook && brew install spellbook"
