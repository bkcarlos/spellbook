[package]
name = "spellbook"
version = "0.1.11"
edition = "2021"
description = "Your personal spellbook of shell incantations — local-first command vault with fuzzy search, parameter templates, and optional AI."
license = "MIT"
repository = "https://github.com/bkcarlos/spellbook"
homepage = "https://github.com/bkcarlos/spellbook"
readme = "README.md"
keywords = ["cli", "commands", "cheatsheet", "egui", "spellbook"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "spellbook"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
egui_commonmark = "0.18"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
fuzzy-matcher = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ureq = { version = "2", features = ["json", "tls"] }
toml = "0.8"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
